<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · DataPilot</title><style>body{font:15px system-ui;background:#f6f7f4;color:#182926;display:grid;place-items:center;min-height:100vh;margin:0}.card{background:white;border:1px solid #e4e9e4;border-radius:14px;padding:32px;width:min(360px,calc(100% - 36px));box-shadow:0 10px 30px #1b38350a}h1{font-size:24px;margin:0 0 8px}p{color:#74817d}label{display:block;font-size:12px;margin:16px 0 6px}input{box-sizing:border-box;width:100%;padding:11px;border:1px solid #dce5e0;border-radius:7px}button{margin-top:20px;width:100%;background:#086e67;color:white;border:0;padding:11px;border-radius:7px;font-weight:600}</style></head><body><form class="card" method="post">{% csrf_token %}<h1>Sign in to DataPilot</h1><p>Use your Django account to open your workspace.</p>{{ form.non_field_errors }}<label for="id_username">Username</label>{{ form.username }}<label for="id_password">Password</label>{{ form.password }}<input type="hidden" name="next" value="{{ next }}"><button type="submit">Sign in</button></form></body></html>
